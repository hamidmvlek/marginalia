<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0A" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout: four columns of small type across the top, an open canvas below with the book's cover dissolved into the background, a slow ticker of branches along the bottom. */
:root {
  --bg: #F2F2EF; --solid: #FFFFFF; --ink: #111111; --ink-2: #74746D; --ink-3: #A9A9A2; --hl: #E3E3DE;
  --fb: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --aura-o: .62;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0B0A; --solid: #000000; --ink: #ECECE7; --ink-2: #8B8B85; --ink-3: #56564F; --hl: #1F1F1C; --aura-o: .5;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0B0B0A; --solid: #000000; --ink: #ECECE7; --ink-2: #8B8B85; --ink-3: #56564F; --hl: #1F1F1C; --aura-o: .5;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
/* the page itself never zooms or rubber-bands; only the map pans and zooms */
html, body { overscroll-behavior: none; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { position: fixed; inset: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
@media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
.keyin { width: 100%; border: 0; border-bottom: 1px solid var(--ink-3); background: none; color: var(--ink); padding: 8px 0; font: 400 16px/1.4 var(--fb); border-radius: 0; }
.keyin:focus { outline: none; border-bottom-color: var(--ink); }
body { background: var(--bg); color: var(--ink); font: 400 12.5px/1.28 var(--fb); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
p { margin: 0; }
.h { text-transform: uppercase; letter-spacing: .01em; }
.dim { color: var(--ink-2); }
.ln { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; text-decoration-color: var(--ink-3); }
.ln:hover { text-decoration-color: var(--ink); }
.ln[disabled] { opacity: .4; cursor: default; }

.stage { position: fixed; inset: 0; overflow: hidden; }

/* aura: the current cover, dissolved */
.aura { position: absolute; z-index: 0; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(58vw, 760px); height: 68vh; pointer-events: none; opacity: var(--aura-o); transition: opacity .6s; }
.aura img { width: 100%; height: 100%; object-fit: cover; filter: blur(70px) saturate(1.25); transform: scale(.9); border-radius: 40%; }
.aura.swap { opacity: 0; }

#canvas { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#canvas.panning { cursor: grabbing; }
.n { cursor: pointer; }
.n:hover .hl { opacity: 1 !important; }
.n.busy .hl { opacity: 1 !important; animation: pulse 1s ease-in-out infinite; }
.n.editing { opacity: .1 !important; }
@keyframes pulse { 50% { opacity: .2; } }

/* reveal: hover a title, the blur clears */
.reveal { position: absolute; inset: 0; z-index: 5; background: var(--solid); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.reveal img { height: min(62vh, 640px); max-width: 60vw; object-fit: contain; filter: blur(48px); transform: scale(1.06); transition: filter .55s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1); }
.reveal.on { opacity: 1; }
.reveal.on img { filter: blur(0); transform: none; }

/* columns */
.cols { position: absolute; z-index: 10; top: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; padding-block: 12px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.cols > section { pointer-events: auto; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols > section > div { display: grid; gap: 0; }
.cols > .cm { display: none; }

.lib { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow-y: auto; scrollbar-width: none; }
.lib li { display: grid; grid-template-columns: 22px 1fr auto; align-items: baseline; }
.lib li .no { font-variant-numeric: tabular-nums; }
.lib li .open { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib li.on .open { text-decoration: underline; text-underline-offset: 2px; }
.lib li .x { color: var(--ink-3); padding-left: 8px; opacity: 0; }
.lib li:hover .x, .lib li .x:focus-visible, .lib li .x.confirm { opacity: 1; }
.lib li .x:hover, .lib li .x.confirm { color: var(--ink); }
.lib .thumb { display: none; }

.links { display: flex; flex-wrap: wrap; gap: 0 10px; }
.panel { max-height: calc(100vh - 140px); overflow-y: auto; scrollbar-width: none; }
.panel textarea { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; resize: none; width: 100%; field-sizing: content; }
.panel textarea:focus { outline: none; }
.panel textarea.t { font-size: 15px; font-weight: 500; line-height: 1.2; min-height: 1.2em; }
.panel textarea.no { min-height: 3.9em; color: var(--ink); }
.panel textarea.no::placeholder { color: var(--ink-3); }
.panel .crumbs button { color: var(--ink-2); }
.panel .crumbs button:hover { color: var(--ink); }
.err { color: var(--ink); border-left: 1px solid var(--ink); padding-left: 8px; }
.keys { display: grid; grid-template-columns: 74px 1fr; color: var(--ink-2); }
.keys span:nth-child(odd) { color: var(--ink); }
.sheetclose { display: none; }

/* ticker */
.ticker { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); overflow: hidden; white-space: nowrap; }
.ticker .track { display: inline-flex; gap: 22px; padding-left: 22px; animation: tick var(--dur, 60s) linear infinite; }
.ticker:hover .track { animation-play-state: paused; }
.ticker button { white-space: nowrap; }
.ticker sup { font-size: 8px; margin-right: 4px; vertical-align: 5px; }
@keyframes tick { to { transform: translateX(-50%); } }

.status { position: absolute; z-index: 7; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; gap: 14px; align-items: baseline; background: var(--solid); padding: 7px 12px; white-space: nowrap; max-width: calc(100% - 32px); }
.toast { position: absolute; z-index: 7; left: 50%; bottom: 44px; transform: translate(-50%, 6px); background: var(--ink); color: var(--bg); padding: 7px 12px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#editor { position: absolute; z-index: 12; resize: none; border: 0; border-bottom: 1px solid var(--ink); background: var(--solid); color: var(--ink); padding: 3px 4px; font-family: var(--fb); line-height: 1.22; overflow: hidden; outline: none; }

/* import sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: grid; place-items: center; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(520px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.sheet .top { display: flex; justify-content: space-between; gap: 12px; }
.drop { border: 1px dashed var(--ink-2); padding: 44px 18px; display: grid; justify-items: center; gap: 6px; text-align: center; transition: background .15s; }
.drop.over { background: var(--solid); border-style: solid; }
.drop .big { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.paste { width: 100%; min-height: 130px; border: 1px solid var(--ink-3); background: var(--solid); color: var(--ink); padding: 8px; font: 400 16px/1.4 var(--fb); resize: vertical; }
.book { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: start; }
.book img { width: 92px; aspect-ratio: 2 / 3; object-fit: cover; background: var(--hl); }
.book .f { display: grid; gap: 4px; min-width: 0; }
.book input { font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--ink-3); padding: 3px 0; width: 100%; }
.book input:focus { outline: none; border-color: var(--ink); }
.book input.bt { font-size: 18px; font-weight: 500; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.opt { display: grid; gap: 2px; }
.opt label { display: grid; grid-template-columns: 16px 1fr; cursor: pointer; color: var(--ink-2); }
.opt label:has(input:checked) { color: var(--ink); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt label::before { content: "○"; }
.opt label:has(input:checked)::before { content: "●"; }
.opt label:has(input:focus-visible) { outline: 1px solid var(--ink); }
.go { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--ink); padding-top: 10px; }
.go .big { font-size: 18px; font-weight: 500; }

/* ---------- phone ---------- */
@media (max-width: 720px) {
  body { font-size: 13.5px; }
  .cols { display: block; padding-block: max(10px, env(safe-area-inset-top, 0px)) 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(var(--bg) 78%, transparent); padding-bottom: 14px; }
  .c1, .c3 { display: none !important; }
  .cm { display: flex !important; flex-direction: column; gap: 6px; }
  .cm .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cm .row button { padding-block: 6px; }
  .cm .tt { font-size: 17px; font-weight: 500; letter-spacing: -.01em; line-height: 1.15; }
  .cm .tools { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding-block: 4px; margin-inline: -16px; padding-inline: 16px; }
  .cm .tools::-webkit-scrollbar { display: none; }
  .cm .tools button { white-space: nowrap; padding-block: 4px; }
  /* books overlay */
  .c2 { position: fixed; inset: 0; z-index: 15; background: var(--bg); padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transform: translateY(102%); transition: transform .32s cubic-bezier(.2,.8,.2,1); overflow-y: auto; }
  .c2.open { transform: none; }
  .c2 .closebooks { display: inline !important; }
  .lib { max-height: none; }
  .lib li { grid-template-columns: 26px 44px 1fr auto; align-items: center; gap: 0 10px; padding-block: 8px; border-bottom: 1px solid var(--hl); }
  .lib .thumb { display: block; width: 44px; aspect-ratio: 2/3; object-fit: cover; background: var(--hl); }
  .lib li .open { white-space: normal; font-size: 15px; padding-block: 6px; }
  .lib li .x { opacity: 1; padding: 8px 0 8px 8px; }
  /* idea sheet */
  .panel { position: fixed; z-index: 14; left: 0; right: 0; bottom: 0; max-height: 56dvh; background: var(--solid); padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -1px 0 var(--hl); transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .panel.open { transform: none; }
  .panel .grab { display: block !important; width: 36px; height: 4px; border-radius: 2px; background: var(--ink-3); margin: -4px auto 2px; }
  .panel .links { gap: 4px 18px; }
  .panel .links button { padding-block: 7px; font-size: 14.5px; }
  .panel textarea { font-size: 16px; }
  .panel textarea.t { font-size: 18px; }
  .keys { display: none; }
  .sheetclose { display: inline; }
  .ticker { font-size: 12.5px; }
  .ticker.hide { opacity: 0; pointer-events: none; }
  .status, .toast { bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  .aura { left: -10vw; right: -10vw; width: auto; top: 50%; transform: translateY(-50%); height: 60vh; }
  .opts { grid-template-columns: 1fr; }
  .opt label { padding-block: 5px; font-size: 15px; }
  .book input { font-size: 16px; }
  .book input.bt { font-size: 19px; }
  #editor { font-size: 16px !important; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .ticker { overflow-x: auto; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="aura" id="aura"><img id="auraImg" alt=""></div>
  <svg id="canvas" aria-label="Mind map"><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg>
  <div class="reveal" id="reveal"><img id="revealImg" alt=""></div>
  <textarea id="editor" hidden spellcheck="false" aria-label="Edit idea"></textarea>

  <header class="cols" id="cols">
    <section class="cm">
      <div class="row"><span class="h">Marginalia</span><span><button class="ln" type="button" data-act="books">Books</button>&nbsp;&nbsp;&nbsp;<button class="ln" type="button" data-act="newBook">Map a book ↗</button></span></div>
      <div class="tt" id="mTitle"></div>
      <div class="dim" id="mMeta"></div>
      <div class="tools">
        <button type="button" data-act="level1">Branches</button><button type="button" data-act="level2">Ideas</button><button type="button" data-act="level99">All</button>
        <button type="button" data-act="fit">Fit</button><button type="button" data-act="undo">Undo</button><button type="button" data-act="redo">Redo</button>
        <button type="button" data-act="png">Save image</button><button type="button" data-act="md">Outline</button><button type="button" data-act="newBlank">Blank map</button><button type="button" data-act="key">API key</button>
      </div>
    </section>

    <section class="c1">
      <div><span class="h">Marginalia</span>
        <p>Mind maps drawn from the books you read. Drop a PDF or EPUB anywhere on this page and the map grows in front of you, idea by idea.</p></div>
      <div><button class="ln" type="button" data-act="newBook">Map a book ↗</button><button class="ln" type="button" data-act="newBlank" style="justify-self:start">Start a blank map</button></div>
      <div class="dim"><span id="usage"></span><span id="storeNote">Saved on this device only.</span> <button class="ln" type="button" data-act="key" id="keyLink">API key</button></div>
    </section>

    <section class="c2" id="books">
      <div class="h" style="display:flex;justify-content:space-between"><span>Books</span><button class="ln closebooks" type="button" data-act="books" style="display:none">Close</button></div>
      <ol class="lib" id="lib"></ol>
    </section>

    <section class="c3">
      <div><span class="h">This map</span><span id="mapTitle"></span><span class="dim" id="mapMeta"></span></div>
      <div><span class="h">View</span>
        <div class="links"><button class="ln" type="button" data-act="level1">Branches</button><button class="ln" type="button" data-act="level2">Ideas</button><button class="ln" type="button" data-act="level99">All</button></div>
        <div class="links"><button class="ln" type="button" data-act="fit">Fit</button><button class="ln" type="button" data-act="zoomOut">Zoom out</button><button class="ln" type="button" data-act="zoomIn">Zoom in</button></div>
        <div class="links"><button class="ln" type="button" data-act="undo">Undo</button><button class="ln" type="button" data-act="redo">Redo</button></div></div>
      <div><span class="h">Export</span>
        <div class="links"><button class="ln" type="button" data-act="png">Image</button><button class="ln" type="button" data-act="md">Outline</button><button class="ln" type="button" data-act="copy">Copy outline</button></div></div>
    </section>

    <section class="c4 panel" id="panel"></section>
  </header>

  <div class="ticker" id="ticker"><div class="track" id="track"></div></div>
  <div class="status" id="status" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Map a book" id="sheet"></div></div>
<input type="file" id="fileInput" accept=".pdf,.epub,.txt,.md,application/pdf,application/epub+zip,text/plain" hidden>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const phone = () => innerWidth <= 720;
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFW = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const JSZIP = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

/* ================= Example ================= */
const N = (text, note, ref, children = []) => ({ id: newId(), text, note, ref, children });
const exampleMap = () => ({
  id: "example-meditations", example: true, author: "Marcus Aurelius", focus: "ideas", created: Date.now(), updated: Date.now() - 864e5,
  root: N("Meditations", "Private notes the Roman emperor wrote to himself on how to live well as a Stoic while carrying an empire.", "Books 1–12", [
    N("The inner citadel", "The mind is a fortress nothing outside can enter unless we let it.", "Books 4, 8", [
      N("Retreat into yourself", "Your own mind is the quietest place there is.", "4.3"),
      N("Events don't disturb us", "Distress comes from our opinion of things, not the things.", "4.7", [
        N("Remove the judgment", "Drop “I have been harmed” and the harm goes with it.", "4.7"),
        N("Pause before assent", "Test each first impression before agreeing with it.", "8.49")]),
      N("The ruling faculty", "Reason is the one part of you fully your own.", "5.11")]),
    N("Nature and the whole", "Everything belongs to one rational, ordered cosmos.", "Books 4, 7", [
      N("Live according to nature", "Humans are rational and social; live for the common good.", "4.39"),
      N("All things are woven together", "Every event is linked in a single fabric.", "7.9"),
      N("The river of change", "Everything flows and is replaced; that is how nature works.", "4.36", [
        N("Nothing to fear in change", "Nothing useful happens without change.", "7.18")])]),
    N("Death and impermanence", "Remembering life's shortness keeps attention on what matters.", "Books 2, 4, 9", [
      N("Act as if it's your last", "Do each thing as the final act of your life.", "2.5"),
      N("Fame is fleeting", "Those who praise you will soon be forgotten too.", "4.19"),
      N("The view from above", "See cities and lives from a height; worries shrink.", "9.30"),
      N("Death is natural", "A scattering of elements, as natural as birth.", "2.12")]),
    N("Virtue is the only good", "Character is good in itself; all else is indifferent.", "Books 3, 6", [
      N("Justice", "Acting for the shared good is what we are for.", "5.6"),
      N("Wisdom", "Seeing things as they are, without our labels.", "6.13"),
      N("Courage and self-control", "Endure what comes; refuse what pulls you off course.", "3.6"),
      N("Indifferents", "Wealth, health and fame are neither good nor bad.", "2.11")]),
    N("Dealing with others", "People will frustrate you; stay kind and keep working with them.", "Books 2, 6", [
      N("Expect difficult people", "Each morning, prepare to meet the ungrateful and arrogant.", "2.1", [
        N("They act from ignorance", "Wrongdoing comes from mistaking bad for good.", "2.1"),
        N("Made to work together", "Like hands and feet, we exist to cooperate.", "2.1")]),
      N("The best revenge", "Don't become like the one who wronged you.", "6.6"),
      N("Gratitude to teachers", "Book 1 lists what he learned from each mentor.", "Book 1")]),
    N("Daily practice", "Stoicism as exercises repeated daily, not theory.", "Books 2, 5", [
      N("Get out of bed", "You were born to do a human's work, not lie warm.", "5.1"),
      N("Only the present", "The present is the only thing anyone can lose.", "2.14"),
      N("Writing as training", "Restating principles until they become habit.", "Books 1–12")]),
    N("Duty and leadership", "Power is a role to fill well, not a reason to change.", "Books 1, 6", [
      N("Don't be Caesarified", "Stay simple, honest and kind while in power.", "6.30"),
      N("The model of Antoninus", "His adoptive father showed patience and fairness.", "1.16"),
      N("Good for the hive", "What harms the hive harms the bee.", "6.54")])
  ])
});

/* ================= Storage ================= */
const LS = "marginalia.maps.v1", US = "marginalia.usage.v1";
const strip = (k, v) => (k[0] === "_" ? undefined : v);
let maps = {};
const store = {
  loadLocal() { try { return JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch { return {}; } },
  saveLocal() { try { localStorage.setItem(LS, JSON.stringify(maps, strip)); } catch {} },
  put() { this.saveLocal(); },
  del() { this.saveLocal(); }
};
const books = (() => {
  let p;

function parseItem(line) {
  const m = line.match(/^(\s*)[-*•]\s+(.+)$/); if (!m) return null;
  const depth = Math.floor(m[1].replace(/\t/g, "  ").length / 2);
  const [text, note, ref] = m[2].split("|").map(s => s.trim().replace(/^\*\*|\*\*$/g, ""));
  if (!text) return null;
  const n = { id: newId(), text: text.slice(0, 90), children: [] };
  if (note) n.note = note.slice(0, 400); if (ref) n.ref = ref.slice(0, 40);
  return { depth, n };
}
function lineFeeder(onLine) {
  let buf = "", seen = 0;
  return { feed(text) { const lines = text.split("\n"); for (; seen < lines.length - 1; seen++) onLine(lines[seen]); }, end(text) { const lines = text.split("\n"); for (; seen < lines.length; seen++) onLine(lines[seen]); } };
}
const byLine = m => m.author ? ` by ${m.author}` : "";

    const rec = await books.get(map.id), path = pathOf(n).map(x => x.text);
    const ctx = passages(rec, [n.text, n.note, path.slice(1, -1).join(" ")].join(" "));
    const prompt = `Book: "${map.root.text}"${byLine(map)}. Mind map path: ${path.join(" > ")}.
${n.children.length ? `Already under it: ${n.children.map(c => c.text).join("; ")}.\n` : ""}Suggest 3 to 5 new, distinct ideas to add under "${n.text}"${ctx ? ", grounded in the passages" : ""}.
Reply with only lines like: - Label (2-6 words) | note, max 14 words | where in the book (omit if unsure)
${ctx ? `<passages>\n${ctx}\n</passages>` : ""}`;

      </div>

      <div class="go"><button class="ln big" type="button" id="go">Draw the map ↗</button><span class="dim">About ${est >= 1000 ? (est / 1000).toFixed(1) + "k" : est} tokens. The book is read on your device first.</span></div>
      <div><button class="ln dim" type="button" id="other">Choose a different book</button></div>`;
    const rerender = () => { book.title = sheet.querySelector("#bt").value; book.author = sheet.querySelector("#ba").value; renderSheet(); };
    sheet.querySelectorAll("input[name=focus]").forEach(i => i.onchange = () => { importFocus = i.value; rerender(); });
    sheet.querySelectorAll("input[name=size]").forEach(i => i.onchange = () => { importSize = i.value; rerender(); });
    sheet.querySelectorAll("input[name=tier]").forEach(i => i.onchange = () => { importSharp = i.value === "sharp"; rerender(); });
    sheet.querySelector("#other").onclick = () => { importState = "pick"; book = null; renderSheet(); };
    sheet.querySelector("#go").onclick = () => { book.title = sheet.querySelector("#bt").value.trim() || "Untitled book"; book.author = sheet.querySelector("#ba").value.trim(); generate(); };
  }
  sheet.querySelector("#sx").onclick = closeImport;
}
const cleanText = t => t.replace(/\r/g, "").replace(/[ \t ]+/g, " ").replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim();
function setBook(r, fallbackTitle) {
  const text = cleanText(r.raw || "");
  // hints were measured on raw text; map them by ratio after cleaning
  const ratio = text.length / Math.max(1, (r.raw || "").length);
  const hints = (r.hints || []).map(h => ({ title: h.title, start: Math.floor(h.start * ratio) }));
  const badTitle = !r.title || /^(untitled|microsoft word|document|\s*$)/i.test(r.title);
  book = { text, title: badTitle ? fallbackTitle : r.title.trim(), author: (r.author || "").trim(), pages: r.pages, cover: r.cover, words: text.split(/\s+/).length, sections: findSections(text, hints) };
  importState = "ready"; renderSheet();
}
$("#fileInput").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) handleFile(f); });
async function handleFile(file) {
  importState = "parsing"; renderSheet({ msg: file.name });
  try {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const prog = msg => { const s = $("#dropMsg"); if (s) s.textContent = msg; };
    let r;
    if (ext === "pdf" || file.type === "application/pdf") r = await readPDF(file, prog);
    else if (ext === "epub" || file.type === "application/epub+zip") r = await readEPUB(file, prog);
    else if (["txt", "md", "markdown", "text"].includes(ext) || file.type.startsWith("text/")) r = { raw: await file.text() };
    else throw new Error("That file type isn't supported. Use a PDF, EPUB or plain text file.");
    if (cleanText(r.raw || "").length < 200) throw new Error("No readable text was found. A scanned PDF needs text recognition (OCR) first.");
    setBook(r, titleFromName(file.name));
  } catch (e) { importState = "pick"; renderSheet({ err: e.message || "Couldn't read that file." }); }
}

/* the map grows on screen while Claude writes it */
async function generate() {
  if (!getKey()) return openKey("Add your API key, then draw the map.");
  const prompt = buildPrompt(), b = book;
  const m = { id: newId(), created: Date.now(), updated: Date.now(), author: b.author, focus: importFocus, size: importSize, cover: b.cover || null, root: { id: newId(), text: b.title, note: "", children: [] } };
  maps[m.id] = m; closeImport(); openMap(m.id, { quiet: true }); renderLibrary();
  books.put(m.id, { text: b.text, sections: b.sections });
  generating = true; genCtl = new AbortController();
  const status = $("#status"); let count = 0;
  const setStatus = msg => { status.hidden = false; status.innerHTML = `<span>${esc(msg)}</span><button class="ln" type="button" id="stopGen">Stop</button>`; status.querySelector("#stopGen").onclick = () => genCtl.abort(); };
  setStatus("Claude is reading the highlights…");
  const stack = [m.root]; let lastFit = 0;
  const feeder = lineFeeder(line => {
    const t = line.trim();
    if (t.startsWith("# ")) { const [ti, au] = t.slice(2).split("|").map(x => x.trim()); if (au && !m.author) m.author = au.slice(0, 120); if (ti && !b.title) m.root.text = ti; return; }
    if (t.startsWith("> ")) { m.root.note = t.slice(2).trim(); return; }
    const it = parseItem(line); if (!it) return;
    const d = Math.min(it.depth, stack.length - 1), parent = stack[d];
    parent.children.push(it.n); stack.length = d + 1; stack.push(it.n); count++;
    if (map === m) { layout(); if (count - lastFit >= 6) { lastFit = count; fit(); } renderHeader(); }
    setStatus(`Drawing, ${count} ideas`);
  });
  try {
    const opts = { signal: genCtl.signal, onText: ({ text }) => feeder.feed(text) };
    if (importSharp) opts.modelTier = "default";
    const { text } = await ask(prompt, opts);
    feeder.end(text);
    if (count < 3) throw { message: "Claude's answer didn't contain a map. Try again." };
    toast(`Mapped ${count} ideas`);
  } catch (e) {
    if (e?.code === "cancelled" && count >= 3) toast(`Stopped. Kept ${count} ideas.`);
    else if (count < 3) { delete maps[m.id]; books.del(m.id); if (map === m) openMap(pickFirst()); renderLibrary(); $("#scrim").hidden = false; importState = "ready"; book = b; renderSheet({ err: errText(e) }); }
    else toast(errText(e));
  } finally {
    generating = false; status.hidden = true;
    if (maps[m.id]) { m.updated = Date.now(); store.put(m); if (map === m) { layout(); renderHeader(); renderPanel(); setTimeout(() => fit(), 100); } renderLibrary(); }
  }
}

/* ================= Wiring ================= */
let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }
function act(a) {
  const vp = viewport();
  ({
    newBook: () => openImport(), newBlank, books: () => $("#books").classList.toggle("open"),
    fit: () => fit(), zoomIn: () => zoomAt(vp.w / 2, vp.top + vp.h / 2, 1.25, true), zoomOut: () => zoomAt(vp.w / 2, vp.top + vp.h / 2, .8, true),
    undo: doUndo, redo: doRedo, level1: () => setLevel(1), level2: () => setLevel(2), level99: () => setLevel(99),
    png: exportPNG, md: exportMD, copy: () => map && copyText(mdOutline()), key: () => openKey()
  })[a]?.();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act); });
document.addEventListener("dragover", e => { if (e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { const f = e.dataTransfer?.files?.[0]; if (f) { e.preventDefault(); openImport(f); } });
const retheme = () => { readTheme(); for (const v of V.values()) v.sig = ""; if (map) layout(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
let rzT = 0; addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => fit(), 150); });
document.fonts?.ready.then(() => { mcache.clear(); coverCache.clear(); renderLibrary(); setAura(); $("#auraImg").src = map ? coverOf(map) : ""; if (map) { for (const v of V.values()) v.sig = ""; layout(); fit(); } });

readTheme();
maps = store.loadLocal();
if (!Object.keys(maps).length) maps[exampleMap().id] = exampleMap();
renderUsage(); renderKeyLink(); renderLibrary(); openMap(pickFirst());
navigator.storage?.persist?.().catch(() => {});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
